name: Convertir Lieder a PDF

# Convierte el corpus OpenScore Lieder (CC0) a PDF con MuseScore 3.6.2 y publica catalog.tsv, que lee el
# backend de YomiScore. Solo convierte lo nuevo o cambiado. A mano, al cambiar el flujo y una vez al mes.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Solo las N primeras canciones (0 = todas)"
        default: "0"
  push:
    branches: [main]
    paths: [".github/workflows/render.yml", "tools/build.py"]
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Corpus OpenScore Lieder
        run: git clone --depth 1 https://github.com/OpenScore/Lieder.git /tmp/lieder

      - name: MuseScore 3.6.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfuse2 libegl1 libopengl0 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 \
            libnss3 libasound2 libpulse0 libjack-jackd2-0 fonts-freefont-ttf xvfb xauth > /dev/null
          curl -sSL -o /tmp/ms.AppImage \
            https://github.com/musescore/MuseScore/releases/download/v3.6.2/MuseScore-3.6.2.548021370-x86_64.AppImage
          chmod +x /tmp/ms.AppImage
          cd /tmp && ./ms.AppImage --appimage-extract > /dev/null
          /tmp/squashfs-root/AppRun --version || true

      - name: Convertir
        env:
          XDG_RUNTIME_DIR: /tmp/runtime
        run: |
          mkdir -p /tmp/runtime && chmod 700 /tmp/runtime
          # MuseScore 3 necesita una pantalla aunque no la use: la pone xvfb.
          python3 tools/build.py --lieder /tmp/lieder --mscore "xvfb-run -a /tmp/squashfs-root/AppRun" --out . \
            --limit "${{ github.event.inputs.limit || '0' }}"

      - name: Publicar
        run: |
          git config user.name "yomiscore-bot"
          git config user.email "yomiscore-bot@users.noreply.github.com"
          git add scores catalog.tsv state.tsv
          if git diff --cached --quiet; then echo "Nada nuevo"; exit 0; fi
          git commit -q -m "PDFs de OpenScore Lieder ($(grep -c . catalog.tsv) líneas en el catálogo)"
          git push
